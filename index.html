<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24272c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Training Log</title>
<style>
:root{
  --bg:#24272c; --plate:#2d3137; --plate2:#363b42; --line:#41474f;
  --chalk:#f1eee7; --mu:#9aa1aa;
  --blue:#4b86e6; --yellow:#e9b93a; --green:#45a862; --grey:#8b8f97; --red:#e2604d;
  --accent:var(--blue);
  --head:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
input,textarea{font:inherit}
.ca{--accent:var(--blue)} .cb{--accent:var(--yellow)} .cc{--accent:var(--green)} .cr{--accent:var(--grey)}

/* day navigation */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav button{width:46px;height:46px;border-radius:50%;background:var(--plate);font-size:22px;line-height:1}
.dn-mid{flex:1;text-align:center}
.dn-date{font-weight:700}
.dn-week{color:var(--mu);font-size:13px}
.linkbtn{display:block;margin:-6px auto 12px;color:var(--mu);font-size:14px;text-decoration:underline}

/* hero */
.hero{display:flex;gap:16px;align-items:center;padding:6px 2px 16px}
.disc{flex:0 0 64px;height:64px;border-radius:50%;background:var(--accent);position:relative;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18)}
.disc::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--bg)}
.hero h1{font-family:var(--head);font-weight:800;font-stretch:condensed;font-size:40px;line-height:1;margin:0;letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:var(--mu);font-size:14px}

.banner{border-left:3px solid var(--accent);padding:8px 12px;font-size:14px;margin-bottom:12px;color:#d9dce0;background:var(--plate);border-radius:0 10px 10px 0}
.banner.ok{border-color:var(--green);color:#bfe7cb}

/* cards */
.card{background:var(--plate);border-radius:14px;padding:14px;margin-bottom:10px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{font-size:17px;margin:0;line-height:1.25}
.count{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{color:var(--chalk);font-size:14px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.meta b{font-weight:700}
.hint{font-size:13px;color:var(--mu)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.up{background:rgba(69,168,98,.18);color:#7fd39a}
.badge.warn{background:rgba(226,96,77,.18);color:#f19584}
.exnum{color:var(--accent);font-family:var(--head);font-weight:800;font-size:18px;margin-right:6px}

.sethead,.set{display:grid;grid-template-columns:26px 1fr 1fr 54px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--mu);margin-top:12px}
.sethead span{text-align:center}
.set{margin-top:6px}
.sn{color:var(--mu);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.num{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);font-size:19px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none;border-color:var(--accent)}
.num::placeholder{color:#6d737c}
.dash{text-align:center;color:var(--mu)}
.tick{height:48px;border-radius:10px;background:var(--plate2);border:1px solid var(--line);font-size:20px;color:var(--mu)}
.set.done .tick{background:var(--green);color:#0f2a18;border-color:var(--green)}
.set.done .num{border-color:rgba(69,168,98,.55)}

.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.card-h + .chk{margin-top:8px}
.box{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;position:relative}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk.on .box::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #0f2a18;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk.on .ct{color:var(--mu);text-decoration:line-through}

.primary{display:block;width:100%;height:56px;border-radius:14px;background:var(--chalk);color:#1c1f23;font-weight:800;font-size:17px;margin:16px 0 8px}
.primary.undo{background:var(--plate2);color:var(--chalk)}
.secondary{display:block;width:100%;height:50px;border-radius:14px;background:var(--plate2);border:1px solid var(--line);font-weight:700;margin:8px 0}

/* week */
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.weeknav button{width:46px;height:46px;border-radius:50%;background:var(--plate);font-size:22px}
.weeknav div{flex:1;text-align:center}
.weeknav strong{display:block;font-family:var(--head);font-size:26px;font-weight:800;line-height:1.1}
.weeknav span{color:var(--mu);font-size:13px}
.dayrow{display:grid;grid-template-columns:46px 18px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 12px;background:var(--plate);border-radius:12px;margin-bottom:6px}
.dayrow.today{box-shadow:inset 0 0 0 2px var(--chalk)}
.dr-d{font-weight:700;line-height:1.1}
.dr-d small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 4px rgba(0,0,0,.2)}
.dr-t{line-height:1.2}
.dr-t small{display:block;color:var(--mu);font-size:13px}
.dr-s{color:var(--green);font-weight:800;font-size:18px}
.dr-s.part{color:var(--yellow);font-size:13px;font-weight:700}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.list li span:last-child{color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.rules p{margin:8px 0 0;font-size:14px;color:#d4d7db}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--plate);border-radius:14px;padding:12px}
.stat strong{display:block;font-family:var(--head);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--mu);font-size:12px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mu);font-weight:500;text-align:right;padding:6px 0;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.pos{color:#7fd39a}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.field input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);padding:0 10px;font-size:16px;width:100%;min-width:0}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);padding:10px;font-size:13px;margin-top:8px}
.empty{color:var(--mu);font-size:14px;margin:8px 0 0}
.danger{color:var(--red)}

/* timer */
.timer{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:#3a3f47;border-radius:16px;padding:10px 12px 13px;display:flex;align-items:center;gap:8px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden}
.timer.hidden{display:none}
.t-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--green);width:0}
.timer.hard .t-bar{background:var(--red)}
.timer.hard .t-time{color:#ffb2a6}
.t-main{flex:1;min-width:0}
.t-label{font-size:13px;color:#c9cdd2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-time{font-family:var(--head);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.t-btn{height:40px;padding:0 13px;border-radius:10px;background:var(--plate2);font-size:14px;font-weight:700}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(36,39,44,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mu)}
.tabs button.on{color:var(--chalk)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--chalk);color:#1c1f23;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* demo sheet */
.demobtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
.demobtn svg{width:16px;height:16px;fill:currentColor}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--plate);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.demo-svg{width:100%;height:auto;display:block;background:var(--plate2);border-radius:14px;margin-top:12px}
.cues{margin:14px 0 4px;padding-left:20px}
.cues li{margin:6px 0;font-size:15px}
.lk{text-align:left;color:var(--chalk);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
</style>
</head>
<body>
<main id="view"></main>

<div id="timer" class="timer hidden" role="status" aria-live="polite">
  <div class="t-main"><div class="t-label" id="tLabel">Rest</div><div class="t-time" id="tTime">0:00</div></div>
  <button class="t-btn" data-act="t30">+30 s</button>
  <button class="t-btn" data-act="tskip">Skip</button>
  <div class="t-bar" id="tBar"></div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V6M16 19v-9M22 19H2"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="toast" class="toast"></div>
<div id="sheet" class="sheet hidden"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ---------- Program ---------- */
const EX = {
  squat:    {name:'Back squat', sets:3, min:8, max:8, start:20, inc:5, rest:150, tip:'Empty bar is fine. Swap for a goblet squat if needed.'},
  bench:    {name:'Bench press', sets:3, min:8, max:8, start:20, inc:2.5, rest:150, tip:'Empty bar, or 10 kg dumbbells.'},
  row:      {name:'Barbell row', sets:3, min:8, max:10, start:20, inc:2.5, rest:120, tip:'Flat back, pull to your lower chest.'},
  rdl:      {name:'Dumbbell RDL', sets:3, min:10, max:10, start:7.5, inc:2.5, rest:90, each:true, tip:'Hips back, soft knees, flat back, weights close to legs.'},
  latraise: {name:'Lateral raise', sets:2, min:12, max:15, start:2.5, inc:1, rest:60, each:true, tip:'Slow and controlled, no swinging.'},
  plank:    {name:'Plank', sets:3, min:30, max:45, start:0, inc:0, rest:45, time:true, tip:'Straight line from head to heels.'},
  legpress: {name:'Leg press', sets:3, min:10, max:10, start:30, inc:5, rest:120, tip:'Weight on the sled. Or goblet squat.'},
  ohp:      {name:'Overhead press (seated DB)', sets:3, min:8, max:8, start:7.5, inc:2.5, rest:120, each:true, tip:'Brace your core, press straight up.'},
  pulldown: {name:'Lat pulldown', sets:3, min:10, max:10, start:25, inc:2.5, rest:90, tip:'Pull to your upper chest, elbows down.'},
  incline:  {name:'Incline DB press', sets:3, min:10, max:10, start:7.5, inc:2.5, rest:90, each:true, tip:'Bench at about 30 degrees.'},
  hipthrust:{name:'Hip thrust', sets:3, min:10, max:12, start:10, inc:5, rest:90, tip:'Start with bodyweight or a dumbbell on your hips.'},
  curl:     {name:'Biceps curl', sets:2, min:12, max:12, start:5, inc:1, rest:0, each:true, tip:'Superset: go straight into pushdowns.'},
  pushdown: {name:'Triceps pushdown', sets:2, min:12, max:12, start:10, inc:2.5, rest:60, tip:'Rest after this, then back to curls.'}
};
const WORKOUTS = {
  A:{title:'Workout A', sub:'Full body, 6 exercises, about 60 min', ex:['squat','bench','row','rdl','latraise','plank']},
  B:{title:'Workout B', sub:'Full body, 7 exercises, about 60 min', ex:['legpress','ohp','pulldown','incline','hipthrust','curl','pushdown']}
};
const WARMUP = ['5 min easy on the bike','Arm circles, 10 each way','Band pull-aparts, 15','Leg swings, 10 each direction','Bodyweight squats, 10',"World's greatest stretch, 5 each side",'2 to 3 lighter ramp-up sets before your first lift'];
const COOLDOWN = ['Finisher: 10 to 15 min easy incline walk or bike','Chest doorway stretch, 30 s','Lat stretch, 30 s each side','Hip flexor lunge stretch, 30 s each side','Hamstring stretch, 30 s each side','Quad stretch, 30 s each side','Pigeon pose, 30 s each side'];
const CARDIO = {
  TUE:{title:'Cardio + core', sub:'Easy pace, 40 to 45 min', items:['5 min easy warm-up','30 min incline walk or bike at a talking pace','Plank, 3 × 30 to 45 s','Dead bugs, 3 × 10 each side','Side plank, 3 × 20 to 30 s each side']},
  THU_EASY:{title:'Easy cardio', sub:'Weeks 1 and 2: keep it easy, intervals start week 3', items:['30 min easy incline walk or bike','10 min stretching and foam rolling: hips, hamstrings, chest, upper back']},
  THU:{title:'Intervals', sub:'Bike or rower, about 40 min', items:['5 min easy warm-up','8 rounds: 30 s hard, 90 s easy','3 to 5 min easy cool-down','10 min stretching and foam rolling: hips, hamstrings, chest, upper back'], intervals:true},
  SAT:{title:'Long cardio', sub:'Easy the whole way, 40 to 45 min', items:['40 to 45 min of something you enjoy: incline walk, light jog, cycling or swimming','5 min stretching']},
  SUN:{title:'Rest day', sub:'No training. Eat well and sleep by 11:30 pm.', items:['Optional: a casual 20 to 30 min walk'], rest:true}
};

/* ---------- Dates ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dow = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d,-dow(d));
const DN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => `${DN[dow(d)]} ${d.getDate()} ${MN[d.getMonth()]}`;
const todayStr = () => ymd(new Date());

/* ---------- State + storage ---------- */
const KEY = 'joel-training-log-v1';
let S = {startDate:null, logs:{}, body:[]};
let ui = {tab:'today', date:todayStr(), weekOffset:0};

const store = {
  async load(){
    try { if (window.storage) { const r = await window.storage.get(KEY,false); if (r && r.value) return JSON.parse(r.value); } } catch(e){}
    try { const v = window.localStorage && localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
    return null;
  },
  async save(){
    const data = JSON.stringify(S); let ok = false;
    try { if (window.storage) { const r = await window.storage.set(KEY,data,false); ok = !!r; } } catch(e){}
    if (!ok) { try { localStorage.setItem(KEY,data); } catch(e){} }
  }
};
let saveT; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => store.save(), 250); };

/* ---------- Plan logic ---------- */
function weekIdx(d){ return Math.round((mondayOf(d) - mondayOf(parse(S.startDate))) / (7*DAY)); }
function progWeek(d){ return weekIdx(d)+1; }
function dayType(d){
  const w = weekIdx(d), i = dow(d);
  const order = (((w%2)+2)%2 === 0) ? ['A','B','A'] : ['B','A','B'];
  if (i===0) return order[0]; if (i===2) return order[1]; if (i===4) return order[2];
  if (i===3) return progWeek(d) <= 2 ? 'THU_EASY' : 'THU';
  return {1:'TUE',5:'SAT',6:'SUN'}[i];
}
const colorClass = t => t==='A'?'ca':t==='B'?'cb':t==='SUN'?'cr':'cc';
const titleOf = t => WORKOUTS[t] ? WORKOUTS[t].title : CARDIO[t].title;
function getLog(date, create){
  let L = S.logs[date];
  if (!L && create) L = S.logs[date] = {type:dayType(parse(date)), sets:{}, checks:{}, done:false};
  return L;
}
const r25 = x => Math.round(x*100)/100;
const fmtW = w => (Math.round(w*100)/100).toString();
const fmtRest = s => s>=60 ? (s%60 ? `${Math.floor(s/60)}:${pad(s%60)} min` : `${s/60} min`) : `${s} s`;
const doneSets = arr => (arr||[]).filter(s => s && s.done);
const hitAll = (ex, sets) => sets.length >= ex.sets && sets.every(s => (+s.r||0) >= ex.max);
const topW = sets => Math.max(...sets.map(s => +s.w||0));

function exHistory(id, before){
  return Object.keys(S.logs).filter(d => d < before).sort().reverse()
    .map(d => ({d, sets:doneSets(S.logs[d].sets[id])})).filter(x => x.sets.length);
}
function targetFor(id, date){
  const ex = EX[id], h = exHistory(id, date);
  if (!h.length) return {w:ex.start, last:null, up:false, stuck:false};
  const last = h[0], lw = topW(last.sets), up = hitAll(ex, last.sets);
  let stuck = false;
  if (!up && !ex.time && h.length >= 3) {
    const h3 = h.slice(0,3), ws = h3.map(x => topW(x.sets));
    stuck = ws.every(w => w === ws[0]) && h3.every(x => !hitAll(ex, x.sets));
  }
  return {w: ex.time ? 0 : (up ? r25(lw + ex.inc) : lw), last, up, stuck};
}

/* ---------- Views ---------- */
const view = document.getElementById('view');
function render(keepScroll){
  const y = window.scrollY;
  view.innerHTML = ui.tab==='today' ? renderToday() : ui.tab==='week' ? renderWeek() : ui.tab==='progress' ? renderProgress() : renderSettings();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===ui.tab));
  window.scrollTo(0, keepScroll ? y : 0);
}

function renderToday(){
  const d = parse(ui.date), t = dayType(d), pw = progWeek(d), isToday = ui.date === todayStr();
  let h = `<div class="daynav"><button data-act="prevday" aria-label="Previous day">‹</button>
    <div class="dn-mid"><div class="dn-date">${isToday ? 'Today, ' : ''}${fmtDate(d)}</div>
    <div class="dn-week">${pw >= 1 ? 'Week ' + pw + ' of your program' : 'Before your program starts'}</div></div>
    <button data-act="nextday" aria-label="Next day">›</button></div>`;
  if (!isToday) h += `<button class="linkbtn" data-act="gotoday">Back to today</button>`;
  return h + (WORKOUTS[t] ? renderLift(t, pw) : renderCardio(t));
}

function hero(t, title, sub){
  return `<section class="hero ${colorClass(t)}"><div class="disc" aria-hidden="true"></div><div><h1>${title}</h1><p>${sub}</p></div></section>`;
}

function renderLift(t, pw){
  const W = WORKOUTS[t], L = getLog(ui.date,false);
  let h = `<div class="${colorClass(t)}">` + hero(t, W.title, W.sub);
  h += L && L.done ? `<div class="banner ok">Workout finished. Nice work.</div>`
    : `<div class="banner">${pw <= 2 ? 'Easy start: stop every set with 3 reps left in the tank.' : 'Stop every set with 1 to 3 reps left in the tank.'} Tap ✓ after each set to start your rest timer.</div>`;
  const wu = [...WARMUP]; if (t==='A' && pw <= 2) wu.splice(6,0,'Broomstick hip hinge drill, 2 × 10 (before RDLs)');
  h += checklist('Warm-up', wu, 'wu');
  W.ex.forEach((id,i) => h += exCard(id,i));
  h += checklist('Finisher and cool-down', COOLDOWN, 'cd');
  h += `<button class="primary ${L && L.done ? 'undo' : ''}" data-act="finish">${L && L.done ? 'Reopen workout' : 'Finish workout'}</button></div>`;
  return h;
}

function checklist(title, items, pre){
  const L = getLog(ui.date,false), c = L ? L.checks : {};
  const n = items.filter((_,i) => c[pre+i]).length;
  return `<section class="card"><div class="card-h"><h2>${title}</h2><span class="count">${n} of ${items.length}</span></div>` +
    items.map((it,i) => `<button class="chk ${c[pre+i] ? 'on' : ''}" data-act="check" data-k="${pre+i}"><span class="box"></span><span class="ct">${it}</span></button>`).join('') + `</section>`;
}

function exCard(id, i){
  const ex = EX[id], L = getLog(ui.date,false), T = targetFor(id, ui.date), sets = (L && L.sets[id]) || [];
  const reps = ex.min === ex.max ? ex.min : `${ex.min} to ${ex.max}`;
  const nDone = doneSets(sets).length;
  let meta = `<b>${ex.sets} sets</b> of <b>${reps} ${ex.time ? 'sec' : 'reps'}</b>`;
  if (!ex.time) meta += ` at <b>${fmtW(T.w)} kg</b>${ex.each ? ' each hand' : ''}`;
  if (ex.rest) meta += `, rest ${fmtRest(ex.rest)}`;
  let hint = ex.tip;
  if (T.last) hint = `Last time: ${ex.time ? '' : fmtW(topW(T.last.sets)) + ' kg for '}${T.last.sets.map(s => s.r).join(', ')} ${ex.time ? 'sec' : 'reps'}`;
  let badge = '';
  if (T.up) badge = `<span class="badge up">${ex.time ? 'Add 5 to 10 s' : '+' + ex.inc + ' kg today'}</span>`;
  else if (T.stuck) badge = `<span class="badge warn">Stuck: try 10% lighter</span>`;
  let rows = '';
  for (let s = 0; s < ex.sets; s++) {
    const st = sets[s] || {};
    const w = st.w !== undefined && st.w !== null ? st.w : T.w;
    const r = st.r !== undefined && st.r !== null ? st.r : '';
    const ph = T.last && T.last.sets[s] ? T.last.sets[s].r : ex.min;
    rows += `<div class="set ${st.done ? 'done' : ''}"><span class="sn">${s+1}</span>` +
      (ex.time ? `<span class="dash">no weight</span>` : `<input class="num" type="number" inputmode="decimal" step="any" aria-label="Set ${s+1} weight" data-f="w" data-ex="${id}" data-s="${s}" value="${w}">`) +
      `<input class="num" type="number" inputmode="numeric" aria-label="Set ${s+1} ${ex.time ? 'seconds' : 'reps'}" data-f="r" data-ex="${id}" data-s="${s}" value="${r}" placeholder="${ph}">` +
      `<button class="tick" data-act="set" data-ex="${id}" data-s="${s}" aria-label="Set ${s+1} done">✓</button></div>`;
  }
  return `<section class="card"><div class="card-h"><h2><span class="exnum">${i+1}</span>${ex.name}</h2>${badge || `<span class="count">${nDone} of ${ex.sets}</span>`}</div>
    <div class="meta">${meta}</div><div class="hint">${hint}</div>
    <button class="demobtn" data-act="demo" data-ex="${id}"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Watch demo</button>
    <div class="sethead"><span>Set</span><span>${ex.time ? '' : 'kg'}</span><span>${ex.time ? 'Seconds' : 'Reps'}</span><span></span></div>${rows}</section>`;
}

function renderCardio(t){
  const C = CARDIO[t], L = getLog(ui.date,false);
  let h = `<div class="${colorClass(t)}">` + hero(t, C.title, C.sub);
  if (L && L.done) h += `<div class="banner ok">Session finished. Nice work.</div>`;
  else if (!C.rest) h += `<div class="banner">Same time as always: 7:00 pm. Keep the pace where you can still talk${t==='THU' ? ', except the hard 30 s efforts' : ''}.</div>`;
  h += checklist(C.rest ? 'Today' : 'Session', C.items, 'c');
  if (C.intervals) h += `<button class="secondary" data-act="intervals">Start interval timer (8 rounds)</button>`;
  if (!C.rest) h += `<button class="primary ${L && L.done ? 'undo' : ''}" data-act="finish">${L && L.done ? 'Reopen session' : 'Finish session'}</button>`;
  return h + `</div>`;
}

function renderWeek(){
  const base = addDays(mondayOf(new Date()), ui.weekOffset*7), pw = progWeek(base), end = addDays(base,6);
  let h = `<div class="weeknav"><button data-act="prevweek" aria-label="Previous week">‹</button><div><strong>${pw >= 1 ? 'Week ' + pw : 'Before start'}</strong>
    <span>${base.getDate()} ${MN[base.getMonth()]} to ${end.getDate()} ${MN[end.getMonth()]}</span></div><button data-act="nextweek" aria-label="Next week">›</button></div>`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(base,i), ds = ymd(d), t = dayType(d), L = S.logs[ds];
    const sub = WORKOUTS[t] ? 'Full body' : CARDIO[t].sub.split(',')[0];
    let st = '';
    if (L && L.done) st = `<span class="dr-s">✓</span>`;
    else if (L && (Object.values(L.checks).some(Boolean) || Object.values(L.sets).some(a => doneSets(a).length))) st = `<span class="dr-s part">Started</span>`;
    h += `<button class="dayrow ${colorClass(t)} ${ds === todayStr() ? 'today' : ''}" data-act="openday" data-d="${ds}">
      <span class="dr-d">${DN[i]}<small>${d.getDate()} ${MN[d.getMonth()]}</small></span><span class="dot"></span>
      <span class="dr-t">${titleOf(t)}<small>${sub}</small></span>${st}</button>`;
  }
  ['A','B'].forEach(k => {
    h += `<section class="card ${colorClass(k)}" style="margin-top:14px"><h2>${WORKOUTS[k].title}</h2><ul class="list">` +
      WORKOUTS[k].ex.map(id => { const e = EX[id]; return `<li><button class="lk" data-act="demo" data-ex="${id}">${e.name}</button><span>${e.sets} × ${e.min===e.max ? e.min : e.min+'–'+e.max}${e.time ? ' s' : ''}</span></li>`; }).join('') + `</ul></section>`;
  });
  h += `<section class="card rules"><h2>How to use it</h2>
    <p><b>Order:</b> Lifting days alternate each week. One week is A, B, A, the next is B, A, B.</p>
    <p><b>Effort:</b> Weeks 1 and 2, stop each set with 3 reps left. After that, 1 to 3 reps left.</p>
    <p><b>Going up:</b> When you hit the top reps on every set, the app shows a green tag and adds the weight for you next time.</p>
    <p><b>Stuck:</b> Same weight for 3 sessions without hitting your reps? Drop about 10% and build back up.</p>
    <p><b>Demos:</b> Tap any exercise name above, or Watch demo on the Today tab, to see how it's done.</p>
    <p><b>Timing:</b> Gym 7:00 to 8:15 pm, dinner by 9:15 pm, sleep 11:30 pm.</p></section>`;
  return h;
}

function renderProgress(){
  const mon = mondayOf(new Date());
  let wk = 0;
  for (let i = 0; i < 6; i++) { const L = S.logs[ymd(addDays(mon,i))]; if (L && L.done) wk++; }
  const total = Object.values(S.logs).filter(L => L.done).length;
  let h = `<div class="stats"><div class="stat"><strong>${wk}/6</strong><span>This week</span></div>
    <div class="stat"><strong>${total}</strong><span>Sessions done</span></div>
    <div class="stat"><strong>${Math.max(1,progWeek(new Date()))}</strong><span>Program week</span></div></div>`;

  let rows = '';
  Object.keys(EX).filter(id => !EX[id].time).forEach(id => {
    const h1 = exHistory(id,'9999-12-31'); if (!h1.length) return;
    const first = topW(h1[h1.length-1].sets), now = topW(h1[0].sets), diff = r25(now-first);
    rows += `<tr><td>${EX[id].name}</td><td>${fmtW(first)}</td><td>${fmtW(now)}</td><td class="${diff > 0 ? 'pos' : ''}">${diff > 0 ? '+' : ''}${fmtW(diff)}</td></tr>`;
  });
  h += `<section class="card"><h2>Lifts (kg)</h2>` + (rows ? `<table class="tbl"><tr><th>Exercise</th><th>First</th><th>Now</th><th>Change</th></tr>${rows}</table>`
    : `<p class="empty">Tick off your first sets on the Today tab and your lifts will show here.</p>`) + `</section>`;

  const body = [...S.body].sort((a,b) => b.d.localeCompare(a.d));
  h += `<section class="card"><h2>Body check-in</h2><p class="hint" style="margin:4px 0 0">Once a week, same morning, before breakfast. A shrinking waist with rising lifts means it's working.</p>
    <div class="row3"><label class="field">Date<input type="date" id="bDate" value="${todayStr()}"></label>
    <label class="field">Weight kg<input type="number" inputmode="decimal" step="any" id="bW" placeholder="71"></label>
    <label class="field">Waist cm<input type="number" inputmode="decimal" step="any" id="bWaist" placeholder="cm"></label></div>
    <button class="secondary" data-act="addbody">Save check-in</button>`;
  if (body.length) {
    h += `<table class="tbl"><tr><th>Date</th><th>Weight</th><th>Waist</th><th></th></tr>` + body.map((b,i) => {
      const d = parse(b.d);
      return `<tr><td>${d.getDate()} ${MN[d.getMonth()]}</td><td>${b.w ?? '–'}</td><td>${b.waist ?? '–'}</td><td><button data-act="delbody" data-d="${b.d}" aria-label="Delete check-in" style="color:var(--mu)">✕</button></td></tr>`;
    }).join('') + `</table>`;
  }
  h += `</section>`;

  const recent = Object.keys(S.logs).filter(d => S.logs[d].done).sort().reverse().slice(0,10);
  h += `<section class="card"><h2>Recent sessions</h2>` + (recent.length ? `<ul class="list">` + recent.map(d => {
    const L = S.logs[d]; const nSets = Object.values(L.sets).reduce((a,x) => a + doneSets(x).length, 0);
    return `<li><span>${fmtDate(parse(d))}, ${titleOf(L.type)}</span><span>${WORKOUTS[L.type] ? nSets + ' sets' : 'Done'}</span></li>`;
  }).join('') + `</ul>` : `<p class="empty">Finish a workout and it will appear here.</p>`) + `</section>`;
  return h;
}

function renderSettings(){
  return `<section class="card"><h2>Program start</h2><p class="hint" style="margin:4px 0 8px">Week 1 begins on the Monday of this date. Changing it re-numbers your weeks, it doesn't delete anything.</p>
    <label class="field">Start week<input type="date" id="startDate" value="${S.startDate}"></label></section>
    <section class="card"><h2>Backup</h2><p class="hint" style="margin:4px 0 8px">Your data lives on this device only. Save a backup every couple of weeks.</p>

    <button class="secondary" data-act="copy">Copy backup text</button>
    <button class="secondary" data-act="importfile">Restore from backup file</button>

    <button class="secondary danger" data-act="reset">Delete all data</button></section>`;
}

      if (q.t === 'plate') g.setAttribute('transform', `translate(${P[q.p][0].toFixed(1)},${P[q.p][1].toFixed(1)})`);
      else if (q.t === 'db') { g.setAttribute('cx', P[q.p][0].toFixed(1)); g.setAttribute('cy', P[q.p][1].toFixed(1)); }
      else if (q.t === 'hbar') { const a = [P.ha2[0]-10, P.ha2[1]], b = [P.ha[0]+10, P.ha[1]]; setLine(g, a, b); setLine(cable, [100,0], [(a[0]+b[0])/2, (a[1]+b[1])/2]); }
      else if (q.t === 'cable') setLine(g, q.from, P[q.p]);
      else if (q.t === 'grip') setLine(g, [P[q.p][0]-6, P[q.p][1]+1], [P[q.p][0]+6, P[q.p][1]-1]);
      else if (q.t === 'plat') { const n = Math.hypot(q.dir[0], q.dir[1]), ux = q.dir[0]/n, uy = q.dir[1]/n, px = -uy, py = ux, c = [P[q.p][0] + ux*5, P[q.p][1] + uy*5]; setLine(g, [c[0]-px*16, c[1]-py*16], [c[0]+px*16, c[1]+py*16]); }
    });
    demoRAF = requestAnimationFrame(frame);
  };
  demoRAF = requestAnimationFrame(frame);
}
function closeDemo(){ if (demoRAF) cancelAnimationFrame(demoRAF); demoRAF = null; const sh = document.getElementById('sheet'); sh.classList.add('hidden'); sh.innerHTML = ''; }

/* ---------- Timer ---------- */
const tEl = document.getElementById('timer'), tLabel = document.getElementById('tLabel'), tTime = document.getElementById('tTime'), tBar = document.getElementById('tBar');
let TM = null, actx = null;
function beep(){
  try { navigator.vibrate && navigator.vibrate([200,80,200]); } catch(e){}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.2, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.35);
  } catch(e){}
}
function startTimer(phases, doneMsg){
  stopTimer();
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
  TM = {phases, i:0, doneMsg, end:Date.now() + phases[0].secs*1000, total:phases[0].secs};
  tEl.classList.remove('hidden'); tick(); TM.iv = setInterval(tick, 250);
}
function tick(){
  if (!TM) return;
  let left = Math.ceil((TM.end - Date.now())/1000);
  if (left <= 0) {
    beep(); TM.i++;
    if (TM.i >= TM.phases.length) { finishTimer(); return; }
    const p = TM.phases[TM.i]; TM.end = Date.now() + p.secs*1000; TM.total = p.secs; left = p.secs;
  }
  const p = TM.phases[TM.i];
  tEl.classList.toggle('hard', !!p.hard);
  tLabel.textContent = p.label;
  tTime.textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  tBar.style.width = `${Math.min(100, (1 - left/TM.total)*100)}%`;
}
function finishTimer(){
  const msg = TM.doneMsg; clearInterval(TM.iv); TM = null;
  tEl.classList.remove('hard'); tLabel.textContent = msg; tTime.textContent = 'Go'; tBar.style.width = '100%';
  setTimeout(() => { if (!TM) tEl.classList.add('hidden'); }, 3500);
}
function stopTimer(){ if (TM) clearInterval(TM.iv); TM = null; tEl.classList.add('hidden'); tEl.classList.remove('hard'); }

/* ---------- Helpers ---------- */
let toastT;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
function restore(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !d.logs) throw 0;
    S = Object.assign({startDate:S.startDate, logs:{}, body:[]}, d);
    save(); render(); toast('Backup restored');
  } catch(e) { toast('That backup could not be read'); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { closeDemo(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; if (ui.tab === 'today') ui.date = ui.date || todayStr(); render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'demo': openDemo(el.dataset.ex); break;
    case 'closedemo': closeDemo(); break;
    case 'prevday': ui.date = ymd(addDays(parse(ui.date),-1)); render(); break;
    case 'nextday': ui.date = ymd(addDays(parse(ui.date),1)); render(); break;
    case 'gotoday': ui.date = todayStr(); render(); break;
    case 'prevweek': ui.weekOffset--; render(); break;
    case 'nextweek': ui.weekOffset++; render(); break;
    case 'openday': ui.date = el.dataset.d; ui.tab = 'today'; render(); break;
    case 'check': { const L = getLog(ui.date,true); L.checks[el.dataset.k] = !L.checks[el.dataset.k]; save(); render(true); break; }
    case 'set': {
      const id = el.dataset.ex, s = +el.dataset.s, ex = EX[id], L = getLog(ui.date,true);
      const arr = L.sets[id] = L.sets[id] || [];
      const row = el.closest('.set'), wi = row.querySelector('[data-f="w"]'), ri = row.querySelector('[data-f="r"]');
      const cur = arr[s] || {};
      cur.w = wi ? (parseFloat(wi.value) || 0) : 0;
      cur.r = ri.value !== '' ? (parseInt(ri.value,10) || 0) : (parseInt(ri.placeholder,10) || ex.min);
      cur.done = !cur.done; arr[s] = cur;
      save(); render(true);
      if (cur.done) {
        if (ex.rest) startTimer([{label:`Rest after ${ex.name.toLowerCase()}`, secs:ex.rest}], 'Rest over. Next set.');
        else startTimer([{label:'Superset: straight to the next exercise', secs:10}], 'Go');
      }
      break;
    }
    case 'finish': {
      const L = getLog(ui.date,true); L.done = !L.done; save(); render(true);
      if (L.done) { stopTimer(); toast('Workout saved'); }
      break;
    }
    case 'intervals': {
      const ph = [{label:'Get ready', secs:10}];
      for (let r = 1; r <= 8; r++) { ph.push({label:`Round ${r} of 8: hard`, secs:30, hard:true}); ph.push({label:`Round ${r} of 8: easy`, secs:90}); }
      startTimer(ph, 'Intervals done. Cool down.');
      break;
    }
    case 't30': if (TM) { TM.end += 30000; TM.total += 30; tick(); } break;
    case 'tskip': if (TM) { if (TM.phases.length > 1 && TM.i < TM.phases.length-1) { TM.end = Date.now(); tick(); } else stopTimer(); } else stopTimer(); break;
    case 'addbody': {
      const d = document.getElementById('bDate').value, w = parseFloat(document.getElementById('bW').value), wa = parseFloat(document.getElementById('bWaist').value);
      if (!d || (isNaN(w) && isNaN(wa))) { toast('Enter your weight or waist first'); break; }
      S.body = S.body.filter(b => b.d !== d);
      S.body.push({d, w:isNaN(w) ? null : w, waist:isNaN(wa) ? null : wa});
      save(); render(true); toast('Check-in saved'); break;
    }
    case 'delbody': S.body = S.body.filter(b => b.d !== el.dataset.d); save(); render(true); break;
    case 'export': {
      try {
        const blob = new Blob([JSON.stringify(S)], {type:'application/json'}), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `training-log-backup-${todayStr()}.json`;
        document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded');
      } catch(e) { toast('Download blocked here. Use Copy backup text.'); }
      break;
    }
    case 'copy': {
      const txt = JSON.stringify(S);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied'), () => {
        const box = document.getElementById('pasteBox'); box.value = txt; box.select(); toast('Select all and copy the text box');
      });
      break;
    }
    case 'importfile': document.getElementById('importFile').click(); break;
    case 'importpaste': restore(document.getElementById('pasteBox').value); break;
    case 'reset':
      if (confirm('Delete every workout and check-in on this device?')) { S = {startDate:ymd(mondayOf(new Date())), logs:{}, body:[]}; save(); render(); toast('All data deleted'); }
      break;
  }
});

view.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.f) return;
  const id = el.dataset.ex, s = +el.dataset.s, L = getLog(ui.date,true);
  const arr = L.sets[id] = L.sets[id] || [];
  arr[s] = arr[s] || {done:false};
  if (el.dataset.f === 'w') {
    const v = parseFloat(el.value); arr[s].w = isNaN(v) ? null : v;
    for (let k = s+1; k < EX[id].sets; k++) {
      if (arr[k] && arr[k].done) continue;
      arr[k] = arr[k] || {done:false}; arr[k].w = arr[s].w;
      const inp = view.querySelector(`input[data-f="w"][data-ex="${id}"][data-s="${k}"]`); if (inp) inp.value = el.value;
    }
  } else {
    const v = parseInt(el.value,10); arr[s].r = isNaN(v) ? null : v;
  }
  save();
});

view.addEventListener('change', e => {
  if (e.target.id === 'startDate' && e.target.value) {
    S.startDate = ymd(mondayOf(parse(e.target.value))); save(); render(true); toast('Start week updated');
  }
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => restore(rd.result); rd.readAsText(f); e.target.value = '';
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDemo(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Start ---------- */
(async () => {
  const d = await store.load();
  if (d) S = Object.assign({startDate:null, logs:{}, body:[]}, d);
  if (!S.startDate) { S.startDate = ymd(mondayOf(new Date())); save(); }
  render();
})();
</script>
</body>
