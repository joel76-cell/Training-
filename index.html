<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Training Log</title>
<style>
:root{
  --bg:#f2f2f7; --plate:#ffffff; --plate2:#f2f2f7; --line:#e5e5ea;
  --chalk:#1c1c1e; --mu:#8e8e93; --stn:#c7c7cc;
  --pink:#ff2d55; --orange:#ff9500; --green:#34c759; --grey:#8e8e93; --red:#ff3b30; --blue:#007aff;
  --accent:var(--blue); --shadow:0 1px 2px rgba(0,0,0,.06);
  --head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000000; --plate:#1c1c1e; --plate2:#2c2c2e; --line:#38383a; --chalk:#ffffff; --mu:#8e8e93; --stn:#48484a;
    --pink:#ff375f; --orange:#ff9f0a; --green:#30d158; --red:#ff453a; --blue:#0a84ff; --shadow:none;}
}
/* colour themes (accents only, except graphite which sets its own base) */
:root[data-theme="ocean"]{--pink:#0a84ff; --orange:#30b0c7; --green:#32d74b; --blue:#0071e3;}
:root[data-theme="forest"]{--pink:#2f9e44; --orange:#c77800; --green:#40c057; --blue:#0b7285;}
:root[data-theme="sunset"]{--pink:#ff375f; --orange:#ff9f0a; --green:#30d158; --blue:#bf5af2;}
:root[data-theme="berry"]{--pink:#af52de; --orange:#ff2d55; --green:#32d74b; --blue:#5e5ce6;}
:root[data-theme="graphite"]{
  --bg:#24272c; --plate:#2d3137; --plate2:#363b42; --line:#41474f; --chalk:#f1eee7; --mu:#9aa1aa; --stn:#5f666f;
  --pink:#4b86e6; --orange:#e9b93a; --green:#45a862; --red:#e2604d; --blue:#6ea8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sw{width:54px;text-align:center;font-size:11px;color:var(--mu)}
.sw i{display:block;width:46px;height:46px;border-radius:50%;margin-bottom:4px;border:2px solid transparent}
.sw.on i{border-color:var(--chalk)}
.sw i span{display:block;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%)}
/* opening animation */
#splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#splash .mark{width:86px;height:86px;border-radius:50%;background:var(--pink);position:relative;box-shadow:inset 0 0 0 10px rgba(255,255,255,.35);
  animation:markIn 1100ms cubic-bezier(.22,.8,.2,1) both}
#splash .mark::after{content:"";position:absolute;inset:32px;border-radius:50%;background:var(--bg)}
#splash .wd{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--chalk);
  animation:wordIn 900ms cubic-bezier(.22,.8,.2,1) 260ms both}
#splash.out{animation:splashOut 520ms cubic-bezier(.4,0,.2,1) both}
@keyframes markIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
@keyframes wordIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes splashOut{to{opacity:0;transform:scale(1.06);visibility:hidden}}
#view, .tabs{animation:appIn 620ms cubic-bezier(.22,.8,.2,1) 980ms both}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #splash,#splash .mark,#splash .wd{animation:none}
  #splash{display:none}
  #view,.tabs{animation:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--chalk);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
input,textarea{font:inherit}
.ca{--accent:var(--pink)} .cb{--accent:var(--orange)} .cc{--accent:var(--green)} .cr{--accent:var(--grey)}

/* day navigation */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav button{width:44px;height:44px;border-radius:50%;background:var(--plate);color:var(--blue);font-size:24px;line-height:1;box-shadow:var(--shadow)}
.dn-mid{flex:1;text-align:center}
.dn-date{font-weight:700}
.dn-week{color:var(--mu);font-size:13px}
.linkbtn{display:block;margin:-6px auto 12px;color:var(--blue);font-size:15px}

/* hero */
.hero{display:flex;gap:16px;align-items:center;padding:6px 2px 16px}
.disc{flex:0 0 58px;height:58px;border-radius:50%;background:var(--accent);position:relative;box-shadow:inset 0 0 0 7px rgba(255,255,255,.35)}
.disc::after{content:"";position:absolute;inset:22px;border-radius:50%;background:var(--bg)}
.hero h1{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.05;margin:0;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:var(--mu);font-size:14px}

.banner{border-left:4px solid var(--accent);padding:10px 12px;font-size:14px;margin-bottom:12px;color:var(--chalk);background:var(--plate);border-radius:12px;box-shadow:var(--shadow)}
.banner.ok{border-color:var(--green)}

/* cards */
.card{background:var(--plate);border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{font-size:17px;margin:0;line-height:1.25;letter-spacing:-.01em}
.count{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{color:var(--chalk);font-size:14px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.meta b{font-weight:700}
.hint{font-size:13px;color:var(--mu)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.up{background:rgba(52,199,89,.16);color:var(--green)}
.badge.warn{background:rgba(255,59,48,.14);color:var(--red)}
.exnum{color:var(--accent);font-weight:700;font-size:17px;margin-right:6px}

.sethead,.set{display:grid;grid-template-columns:26px 1fr 1fr 54px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--mu);margin-top:12px}
.sethead span{text-align:center}
.set{margin-top:6px}
.sn{color:var(--mu);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.num{width:100%;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);font-size:19px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num:focus{outline:none;border-color:var(--accent)}
.num::placeholder{color:#6d737c}
.dash{text-align:center;color:var(--mu)}
.tick{height:48px;border-radius:10px;background:var(--plate2);border:1px solid var(--line);font-size:20px;color:var(--mu)}
.set.done .tick{background:var(--green);color:#fff;border-color:var(--green)}
.set.done .num{border-color:var(--green)}

.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.card-h + .chk{margin-top:8px}
.box{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;position:relative}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk.on .box::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk.on .ct{color:var(--mu);text-decoration:line-through}

.primary{display:block;width:100%;height:54px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;margin:16px 0 8px}
.primary.undo{background:var(--plate);color:var(--blue);box-shadow:var(--shadow)}
.secondary{display:block;width:100%;height:48px;border-radius:12px;background:var(--plate2);color:var(--blue);border:0;font-weight:600;margin:8px 0}

/* week */
.weeknav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.weeknav button{width:44px;height:44px;border-radius:50%;background:var(--plate);color:var(--blue);font-size:24px;box-shadow:var(--shadow)}
.weeknav div{flex:1;text-align:center}
.weeknav strong{display:block;font-family:var(--head);font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.weeknav span{color:var(--mu);font-size:13px}
.dayrow{display:grid;grid-template-columns:46px 18px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--plate);border-radius:14px;margin-bottom:6px;box-shadow:var(--shadow)}
.dayrow.today{box-shadow:inset 0 0 0 2px var(--blue)}
.dr-d{font-weight:700;line-height:1.1}
.dr-d small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.dot{width:15px;height:15px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.dr-t{line-height:1.2}
.dr-t small{display:block;color:var(--mu);font-size:13px}
.dr-s{color:var(--green);font-weight:700;font-size:18px}
.dr-s.part{color:var(--orange);font-size:13px;font-weight:600}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.list li span:last-child{color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.rules p{margin:8px 0 0;font-size:14px;color:#d4d7db}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--plate);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat strong{display:block;font-family:var(--head);font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent,var(--chalk))}
.stat span{color:var(--mu);font-size:12px}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mu);font-weight:500;text-align:right;padding:6px 0;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.pos{color:var(--green)}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.field input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);padding:0 10px;font-size:16px;width:100%;min-width:0}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);background:var(--plate2);color:var(--chalk);padding:10px;font-size:13px;margin-top:8px}
.empty{color:var(--mu);font-size:14px;margin:8px 0 0}
.danger{color:var(--red)}

/* timer */
.timer{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto;background:var(--plate);border:1px solid var(--line);border-radius:18px;padding:10px 12px 13px;display:flex;align-items:center;gap:8px;z-index:30;box-shadow:0 10px 26px rgba(0,0,0,.18);overflow:hidden}
.timer.hidden{display:none}
.t-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--green);width:0}
.timer.hard .t-bar{background:var(--red)}
.timer.hard .t-time{color:var(--red)}
.t-main{flex:1;min-width:0}
.t-label{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-time{font-family:var(--head);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-btn{height:40px;padding:0 14px;border-radius:20px;background:var(--plate2);color:var(--blue);font-size:15px;font-weight:600}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--plate);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mu)}
.tabs button.on{color:var(--blue)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--chalk);color:var(--plate);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* demo sheet */
.btnrow{display:flex;gap:16px;flex-wrap:wrap}
.demobtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
.demobtn svg{width:16px;height:16px;fill:currentColor}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.demo-svg{width:100%;height:auto;display:block;background:var(--plate);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.demo-svg .fig{stroke:var(--chalk)}
.demo-svg .figf{fill:var(--chalk)}
.demo-svg .stn{stroke:var(--stn)}
.demo-svg .grd{stroke:var(--line)}
.demo-svg .eqf{fill:var(--accent);stroke:var(--plate)}
.demo-svg .eql{stroke:var(--accent)}
.demo-svg .cbl{stroke:var(--mu)}
.works{font-size:13px;color:var(--mu);margin-top:4px;text-align:left}
button.works{width:100%;padding:2px 0}
button.works b{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.bodymap{width:100%;height:auto;display:block;margin-top:10px}
.bodymap .bg{fill:var(--line)}
.bodymap .on{fill:var(--accent)}
.bodymap .sec{fill:var(--accent);opacity:.45}
.bodymap text{fill:var(--mu);font-size:9px;font-family:inherit}
.key{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px;align-items:center;flex-wrap:wrap}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.key i.s{opacity:.45}
.clock{display:flex;justify-content:space-between;align-items:center;background:var(--plate);border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--shadow);font-size:14px}
.clock b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.splits{display:flex;gap:6px;margin-bottom:10px}
.split{flex:1;background:var(--plate);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow)}
.split strong{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.split span{font-size:11px;color:var(--mu)}
.mins{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.report h3{margin:16px 0 4px;font-size:15px}
.report .big{font-size:15px;line-height:1.5}
.askbtn{display:block;width:100%;height:48px;line-height:48px;border-radius:12px;background:var(--plate2);color:var(--blue);font-weight:600;text-align:center;text-decoration:none;margin:10px 0}
.startbtn{height:48px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.set.done .startbtn{background:var(--plate2);color:var(--blue)}
.works b{color:var(--accent);font-weight:600}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.switch .pill{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:0 0 51px}
.switch.on .pill{background:var(--green)}
.switch .pill::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on .pill::after{left:22px}
.cues{margin:14px 0 4px;padding-left:20px}
.cues li{margin:6px 0;font-size:15px}
.sheet-card .chk .hint{font-weight:400}
.sheet-card .chk{align-items:center}
.lk{text-align:left;color:var(--chalk);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="mark"></div><div class="wd">Training Log</div></div>
<main id="view"></main>

<div id="timer" class="timer hidden" role="status" aria-live="polite">
  <div class="t-main"><div class="t-label" id="tLabel">Rest</div><div class="t-time" id="tTime">0:00</div></div>
  <button class="t-btn" data-act="t30">+30 s</button>
  <button class="t-btn" data-act="tskip">Skip</button>
  <div class="t-bar" id="tBar"></div>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V6M16 19v-9M22 19H2"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="toast" class="toast"></div>
<div id="sheet" class="sheet hidden"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ---------- Program ---------- */
const SLOTS = {
  squat:{sets:3, min:8, max:8, rest:150, opts:[
    {id:'squat', name:'Back squat (barbell)', start:20, inc:5, demo:'squat', tip:'Empty bar is fine to start.'},
    {id:'goblet', name:'Goblet squat', start:10, inc:2.5, demo:'squat', tip:'Hold one dumbbell at your chest, elbows down. Log the dumbbell weight.'},
    {id:'smithsq', name:'Smith machine squat', start:20, inc:5, demo:'squat', tip:'Bar runs on rails, so no balance or spotter needed.'},
    {id:'hacksq', name:'Hack squat machine', start:20, inc:5, demo:'legpress', tip:'Back flat on the pad, push through your whole foot.'},
    {id:'bss', name:'Bulgarian split squat', start:0, inc:2.5, each:true, min:8, max:10, tip:'Back foot on a bench, one leg at a time. Start at bodyweight (log 0).',
     cues:['Back foot on a bench, front foot well forward','Drop straight down, front knee over your foot','Push through your front heel to stand']}
  ]},
  bench:{sets:3, min:8, max:8, rest:150, opts:[
    {id:'bench', name:'Bench press (barbell)', start:20, inc:2.5, demo:'bench', tip:'Empty bar to start. Shoulder blades back and down.'},
    {id:'dbbench', name:'Dumbbell bench press', start:10, inc:2.5, each:true, demo:'bench', tip:'Log one dumbbell. No spotter needed.'},
    {id:'machinechest', name:'Chest press machine', start:15, inc:5, demo:'bench', tip:'Handles at mid-chest height. Easiest option to set up.'},
    {id:'pushup', name:'Push-up', start:0, inc:0, min:8, max:15, tip:'Bodyweight (log 0). Hands on a bench to make it easier.',
     cues:['Hands slightly wider than your shoulders','Body in a straight line, squeeze your glutes','Elbows about 45 degrees, chest to the floor']}
  ]},
  row:{sets:3, min:8, max:10, rest:120, opts:[
    {id:'row', name:'Barbell row', start:20, inc:2.5, demo:'row', tip:'Flat back, pull to your lower chest.'},
    {id:'dbrow', name:'Single-arm dumbbell row', start:10, inc:2.5, each:true, demo:'row', tip:'One hand and knee on a bench. Log one dumbbell.'},
    {id:'cablerow', name:'Seated cable row', start:25, inc:5, demo:'pulldown', tip:'Chest up, pull to your belly, squeeze your shoulder blades.'},
    {id:'machinerow', name:'Chest-supported machine row', start:20, inc:5, demo:'pulldown', tip:'Chest on the pad, easiest on your lower back.'}
  ]},

/* ---------- Dates ---------- */
const DAY = 864e5;
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dow = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d,-dow(d));
const DN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => `${DN[dow(d)]} ${d.getDate()} ${MN[d.getMonth()]}`;
const todayStr = () => ymd(new Date());

/* ---------- State + storage ---------- */
const KEY = 'joel-training-log-v1';
let S = {startDate:null, logs:{}, body:[], picks:{}, sound:true, mode:'full', theme:'health'};

const store = {
  async load(){
    try { if (window.storage) { const r = await window.storage.get(KEY,false); if (r && r.value) return JSON.parse(r.value); } } catch(e){}
    try { const v = window.localStorage && localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
    return null;
  },
  async save(){
    const data = JSON.stringify(S); let ok = false;
    try { if (window.storage) { const r = await window.storage.set(KEY,data,false); ok = !!r; } } catch(e){}
    if (!ok) { try { localStorage.setItem(KEY,data); } catch(e){} }
  }
};
let saveT; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => store.save(), 250); };

/* ---------- Plan logic ---------- */
function weekIdx(d){ return Math.round((mondayOf(d) - mondayOf(parse(S.startDate))) / (7*DAY)); }
function progWeek(d){ return weekIdx(d)+1; }
function planId(){ return PLANS[S.mode] ? S.mode : 'full'; }
function dayType(d){
  const w = weekIdx(d), i = dow(d);
  if (planId() === 'ul') return PLANS.ul.days[i];
  const order = (((w%2)+2)%2 === 0) ? ['A','B','A'] : ['B','A','B'];
  if (i===0) return order[0]; if (i===2) return order[1]; if (i===4) return order[2];
  if (i===3) return progWeek(d) <= 2 ? 'THU_EASY' : 'THU';
  return {1:'TUE',5:'SAT',6:'SUN'}[i];
}
function typeFor(ds){
  const L = S.logs[ds];
  if (L && L.type && (WORKOUTS[L.type] || CARDIO[L.type])) return L.type;
  return dayType(parse(ds));
}
const colorClass = t => (t==='A'||t==='UA'||t==='UB') ? 'ca' : (t==='B'||t==='LA'||t==='LB') ? 'cb' : t==='SUN' ? 'cr' : 'cc';
const titleOf = t => WORKOUTS[t] ? WORKOUTS[t].title : CARDIO[t].title;
function getLog(date, create){
  let L = S.logs[date];
  if (!L && create) L = S.logs[date] = {type:dayType(parse(date)), sets:{}, checks:{}, done:false};
  return L;
}
function mark(sec){
  const L = getLog(ui.date, true);
  if (ui.date !== todayStr()) return;
  L.t = L.t || {};
  const o = L.t[sec] = L.t[sec] || {s:Date.now()};
  o.e = Date.now();
}
const mins = ms => Math.max(0, Math.round(ms/60000));
function secTime(L, k){ const o = L && L.t && L.t[k]; return o && o.e ? o.e - o.s : 0; }
function sessionSpan(L){
  if (!L || !L.t) return 0;
  const all = Object.values(L.t);
  if (!all.length) return 0;
  const s0 = Math.min(...all.map(o => o.s)), e0 = Math.max(...all.map(o => o.e || o.s));
  return e0 - s0;
}
function fmtClock(ms){ const t = Math.floor(ms/1000); return `${Math.floor(t/60)}:${pad(t%60)}`; }

function curEx(slot){
  const pick = S.picks && S.picks[slot];
  return (pick && EX[pick] && EX[pick].slot === slot) ? pick : SLOTS[slot].opts[0].id;
}
const r25 = x => Math.round(x*100)/100;
const fmtW = w => (Math.round(w*100)/100).toString();
const fmtRest = s => s>=60 ? (s%60 ? `${Math.floor(s/60)}:${pad(s%60)} min` : `${s/60} min`) : `${s} s`;
const doneSets = arr => (arr||[]).filter(s => s && s.done);
const hitAll = (ex, sets) => sets.length >= ex.sets && sets.every(s => (+s.r||0) >= ex.max);
const topW = sets => Math.max(...sets.map(s => +s.w||0));

function exHistory(id, before){
  return Object.keys(S.logs).filter(d => d < before).sort().reverse()
    .map(d => ({d, sets:doneSets(S.logs[d].sets[id])})).filter(x => x.sets.length);
}
function targetFor(id, date){
  const ex = EX[id], h = exHistory(id, date);
  if (!h.length) return {w:ex.start, last:null, up:false, stuck:false};
  const last = h[0], lw = topW(last.sets), up = hitAll(ex, last.sets);
  let stuck = false;
  if (!up && !ex.time && h.length >= 3) {
    const h3 = h.slice(0,3), ws = h3.map(x => topW(x.sets));
    stuck = ws.every(w => w === ws[0]) && h3.every(x => !hitAll(ex, x.sets));
  }
  return {w: ex.time ? 0 : (up ? Math.max(0, r25(lw + ex.inc)) : lw), last, up, stuck};
}

    <button data-act="nextday" aria-label="Next day">›</button></div>`;
  if (!isToday) h += `<button class="linkbtn" data-act="gotoday">Back to today</button>`;
  if (isToday && dow(d) === 0) {
    const lastMon = addDays(mondayOf(d), -7);
    if (weekStats(lastMon).sessions) h += `<button class="banner cc" data-act="report" data-w="-1" style="display:block;width:100%;text-align:left">Last week is done. Tap to see your week report.</button>`;
  }
  return h + (WORKOUTS[t] ? renderLift(t, pw) : renderCardio(t));

function hero(t, title, sub){
  return `<section class="hero ${colorClass(t)}"><div class="disc" aria-hidden="true"></div><div><h1>${title}</h1><p>${sub}</p></div></section>`;
}

function renderLift(t, pw){
  const W = WORKOUTS[t], L = getLog(ui.date,false);
  let h = `<div class="${colorClass(t)}">` + hero(t, W.title, W.sub);
  h += L && L.done ? `<div class="banner ok">Workout finished. Nice work.</div>`
    : `<div class="banner">${pw <= 2 ? 'Easy start: stop every set with 3 reps left in the tank.' : 'Stop every set with 1 to 3 reps left in the tank.'} Tap ✓ after each set to start your rest timer.</div>`;
  h += timeStrip(L);
  const wu = [...WARMUP]; if (t==='A' && pw <= 2) wu.splice(6,0,'Broomstick hip hinge drill, 2 × 10 (before RDLs)');
  h += checklist('Warm-up', wu, 'wu', secTime(L,'wu'));
  W.ex.forEach((sl,i) => h += exCard(sl,i));
  h += checklist('Finisher and cool-down', COOLDOWN, 'cd', secTime(L,'cd'));
  h += `<button class="primary ${L && L.done ? 'undo' : ''}" data-act="finish">${L && L.done ? 'Reopen workout' : 'Finish workout'}</button></div>`;
  return h;
}

function timeStrip(L){
  const span = sessionSpan(L);
  if (!span && !(L && L.t)) return '';
  const live = L && !L.done && ui.date === todayStr();
  const wu = secTime(L,'wu'), wk = secTime(L,'wk'), cd = secTime(L,'cd');
  return `<div class="clock"><span>${L && L.done ? 'Session time' : 'Session running'}</span>
      <b id="liveClock" data-start="${L && L.t ? Math.min(...Object.values(L.t).map(o => o.s)) : 0}" data-live="${live ? 1 : 0}">${fmtClock(live ? Date.now() - Math.min(...Object.values(L.t).map(o => o.s)) : span)}</b></div>
    <div class="splits">
      <div class="split"><strong>${mins(wu)}<span style="font-size:12px"> min</span></strong><span>Warm-up</span></div>
      <div class="split"><strong>${mins(wk)}<span style="font-size:12px"> min</span></strong><span>Training</span></div>
      <div class="split"><strong>${mins(cd)}<span style="font-size:12px"> min</span></strong><span>Stretching</span></div>
    </div>`;
}
function checklist(title, items, pre, took){
  const L = getLog(ui.date,false), c = L ? L.checks : {};
  const n = items.filter((_,i) => c[pre+i]).length;
  return `<section class="card"><div class="card-h"><h2>${title}</h2><span class="count">${took ? mins(took) + ' min · ' : ''}${n} of ${items.length}</span></div>` +
    items.map((it,i) => `<button class="chk ${c[pre+i] ? 'on' : ''}" data-act="check" data-k="${pre+i}"><span class="box"></span><span class="ct">${it}</span></button>`).join('') + `</section>`;
}

function exCard(slot, i){
  const id = curEx(slot), ex = EX[id], nOpts = SLOTS[slot].opts.length;
  const L = getLog(ui.date,false), T = targetFor(id, ui.date), sets = (L && L.sets[id]) || [];
  const reps = ex.min === ex.max ? ex.min : `${ex.min} to ${ex.max}`;
  const nDone = doneSets(sets).length;
  let meta = `<b>${ex.sets} sets</b> of <b>${reps} ${ex.time ? 'sec' : 'reps'}</b>`;
  if (!ex.time) meta += T.w ? ` at <b>${fmtW(T.w)} kg</b>${ex.each ? ' each hand' : ''}` : ` at <b>bodyweight</b>`;
  if (ex.rest) meta += `, rest ${fmtRest(ex.rest)}`;
  let hint = ex.tip;
  if (T.last) hint = `Last time: ${(ex.time || !topW(T.last.sets)) ? '' : fmtW(topW(T.last.sets)) + ' kg for '}${T.last.sets.map(s => s.r).join(', ')} ${ex.time ? 'sec' : 'reps'}`;
  let badge = '';
  if (T.up) badge = `<span class="badge up">${ex.time ? 'Add 5 to 10 s' : (ex.inc < 0 ? ex.inc + ' kg assist' : '+' + ex.inc + ' kg') + ' today'}</span>`;
  else if (T.stuck) badge = `<span class="badge warn">Stuck: try 10% lighter</span>`;
  let rows = '';
  for (let s = 0; s < ex.sets; s++) {
    const st = sets[s] || {};
    const w = st.w !== undefined && st.w !== null ? st.w : T.w;

/* ---------- Weekly report ---------- */
function weekStats(monday){
  const days = [], out = {sessions:0, lifts:0, sets:0, volume:0, minutes:0, cardio:0, prs:[], target:6};
  for (let i = 0; i < 7; i++) days.push(ymd(addDays(monday,i)));
  days.forEach(d => {
    const L = S.logs[d]; if (!L) return;
    const isLift = !!WORKOUTS[L.type];
    if (L.done) { out.sessions++; if (isLift) out.lifts++; else out.cardio++; }
    out.minutes += mins(L.total || sessionSpan(L));
    Object.keys(L.sets || {}).forEach(id => {
      doneSets(L.sets[id]).forEach(st => { out.sets++; out.volume += (+st.w || 0) * (+st.r || 0) * (EX[id] && EX[id].each ? 2 : 1); });
    });
  });
  // lifts that went up compared with anything before this week
  Object.keys(EX).forEach(id => {
    const inWeek = days.filter(d => S.logs[d] && doneSets(S.logs[d].sets && S.logs[d].sets[id]).length);
    if (!inWeek.length) return;
    const best = Math.max(...inWeek.map(d => topW(doneSets(S.logs[d].sets[id]))));
    const before = exHistory(id, days[0]);
    if (!before.length) return;
    const prev = Math.max(...before.map(x => topW(x.sets)));
    if (best > prev) out.prs.push(`${EX[id].name}: ${fmtW(prev)} to ${fmtW(best)} kg`);
  });
  return out;
}
function openReport(monday){
  const w = weekStats(monday), n = progWeek(monday), end = addDays(monday,6);

  else if (w.sessions >= 4) verdict = 'Solid week. Aim to pick up the missed session next week.';
  else if (w.sessions >= 1) verdict = 'A few sessions in. Getting the three lifting days done is what matters most.';
  else verdict = 'No sessions logged this week. Start again with the next lifting day, at the weight you last used.';
  sheet.innerHTML = `<div class="sheet-card ca report" role="dialog" aria-modal="true" aria-label="Weekly report">
    <div class="card-h"><h2>Week ${n} report</h2><button class="t-btn" data-act="closedemo">Close</button></div>

/* ---------- Muscle map ---------- */
const MKEYS = [['lower back',['lowb']],['upper back',['upb']],['mid back',['upb']],
  ['front shoulders',['deltF']],['side shoulders',['deltS']],['rear shoulders',['deltR']],['shoulders',['deltF','deltS']],
  ['upper chest',['chest']],['lower chest',['chest']],['chest',['chest']],['lats',['lats']],
  ['triceps',['tri']],['biceps',['bi']],['forearms',['fore']],['quads',['quad']],['hamstrings',['ham']],
  ['glutes',['glut']],['calves',['calf']],['obliques',['obl']],['deep core',['abs']],['abs',['abs']],['core',['abs']]];
function muscleSets(works){
  const prim = new Set(), sec = new Set();
  (works || '').split(',').forEach((part, i) => {
    const t = part.toLowerCase().replace(/\(.*?\)/g,'').trim();
    const hit = MKEYS.find(k => t.indexOf(k[0]) >= 0);
    if (hit) hit[1].forEach(k => (i === 0 ? prim : sec).add(k));
  });
  prim.forEach(k => sec.delete(k));
  return {prim, sec};
}

                    : (prim.has('deltR') || prim.has('deltS') ? 'on' : (sec.has('deltR') || sec.has('deltS') ? 'sec' : 'bg'));
    return d;
  };

  const front = `<g transform="translate(4,6)">${head}

    <rect class="${c('bi')}" x="14" y="45" width="10" height="23" rx="5"/><rect class="${c('bi')}" x="64" y="45" width="10" height="23" rx="5"/>
    <rect class="${c('fore')}" x="11" y="69" width="9" height="23" rx="4.5"/><rect class="${c('fore')}" x="68" y="69" width="9" height="23" rx="4.5"/>

    A:{head:[96,28],sh:[96,42],s1:[110,44],s2:[82,44],hip:[96,86],h1:[104,88],h2:[88,88],kn:[106,119],an:[107,150],kn2:[86,119],an2:[85,150],el:[110,66],ha:[116,88],el2:[79,66],ha2:[78,88]},
    B:{el:[130,46],ha:[152,44]},

    st:'<rect x="88" y="56" width="24" height="52" rx="3"/><rect x="80" y="108" width="40" height="8" rx="2"/><path d="M84 116V150M116 116V150"/>',
    A:{head:[100,46],sh:[100,60],s1:[114,62],s2:[86,62],hip:[100,108],h1:[108,110],h2:[92,110],kn:[112,122],an:[114,150],kn2:[88,122],an2:[86,150],el:[120,80],ha:[116,62],el2:[80,80],ha2:[84,62]},

DEMO.gobletB = DEMO.goblet; DEMO.smithB = DEMO.smithsq; DEMO.hackpress = DEMO.hacksq;
DEMO.cablerowB = DEMO.cablerow; DEMO.legcurlB = DEMO.legcurl;
Object.values(DEMO).forEach(D => {
  D.B = Object.assign({}, D.A, D.B);
  [D.A, D.B].forEach(P => { if (!P.s1) P.s1 = P.sh; if (!P.h1) P.h1 = P.hip; });
});
const PAIRS = [['hip','sh'],['s1','s2'],['h1','h2'],['s1','el'],['el','ha'],['s2','el2'],['el2','ha2'],['h1','kn'],['kn','an'],['h2','kn2'],['kn2','an2']];
const SVGNS = 'http://www.w3.org/2000/svg';
let demoRAF = null;
function demoOf(id){ const e = EX[id] || {}; return DEMO[id] || DEMO[e.demo]; }
function hasDemo(id){ return !!(demoOf(id) || (EX[id] && EX[id].cues)); }
function mk(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function setLine(l, a, b){ l.setAttribute('x1',a[0].toFixed(1)); l.setAttribute('y1',a[1].toFixed(1)); l.setAttribute('x2',b[0].toFixed(1)); l.setAttribute('y2',b[1].toFixed(1)); }

function openDemo(id){
  const ex = EX[id]; if (!ex) return;
  const D = demoOf(id);
  const cues = ex.cues || (D && D.cues) || [];
  const cls = WORKOUTS.A.ex.includes(ex.slot) ? 'ca' : 'cb';
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `<div class="sheet-card ${cls}" role="dialog" aria-modal="true" aria-label="${ex.name} demo">
    <div class="card-h"><h2>${ex.name}</h2><button class="t-btn" data-act="closedemo">Close</button></div>
    <div class="meta">${ex.sets} sets of ${ex.min === ex.max ? ex.min : ex.min + ' to ' + ex.max} ${ex.time ? 'sec' : 'reps'}</div>
    <div class="works">Works: <b>${ex.works}</b></div>
    ${bodyMap(ex.works)}
    ${D ? `<svg class="demo-svg" viewBox="0 0 200 160" role="img" aria-label="Animated ${ex.name} demo">
      <line class="grd" x1="8" y1="151" x2="192" y2="151" stroke-width="2"/>
      <g class="stn" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${D.st || ''}</g>
      <g id="dFig" class="fig" stroke-width="5" stroke-linecap="round" fill="none"></g>
      <g id="dEq"></g>
    </svg>` : ''}
    <ul class="cues">${cues.map(c => `<li>${c}</li>`).join('')}</ul>
</div>`;
  sheet.classList.remove('hidden');
  if (!D) return;

  const fig = document.getElementById('dFig'), eqG = document.getElementById('dEq');
  if (D.back) fig.parentNode.insertBefore(eqG, fig);
  const segs = PAIRS.filter(([a,b]) => D.A[a] && D.A[b] && !(a === 's1' && D.A.s1 === D.A.sh && b === 's2')).map(pr => ({pr, el:mk('line', {}, fig)}));
  const foot = (D.foot !== false && !D.front) ? mk('line', {}, fig) : null;
  const head = mk('circle', {r:8, class:'figf', stroke:'none'}, fig);
  const eqs = D.eq.map(q => {
    if (q.t === 'plate') { const g = mk('g', {}, eqG); mk('circle', {r:q.r || 13, class:'eqf', 'stroke-width':2}, g); mk('circle', {r:3, class:'stn', fill:'currentColor', opacity:.6}, g); return {q, g}; }
    if (q.t === 'db' || q.t === 'pad') return {q, g:mk('circle', {r:q.r || 7, class:'eqf', 'stroke-width':2}, eqG)};
    if (q.t === 'hbar') return {q, cable:mk('line', {class:'cbl', 'stroke-width':1.5}, eqG), g:mk('line', {class:'eql', 'stroke-width':5, 'stroke-linecap':'round'}, eqG)};
    if (q.t === 'vgrip') return {q, cable:mk('line', {class:'cbl', 'stroke-width':1.5}, eqG), g:mk('line', {class:'eql', 'stroke-width':5, 'stroke-linecap':'round'}, eqG)};
    if (q.t === 'cable') return {q, g:mk('line', {class:'cbl', 'stroke-width':1.5}, eqG)};
    if (q.t === 'bar') { const g = mk('g', {}, eqG); return {q, g, line:mk('line', {class:'eql', 'stroke-width':5, 'stroke-linecap':'round'}, g), c1:mk('circle', {r:7, class:'eqf', 'stroke-width':2}, g), c2:mk('circle', {r:7, class:'eqf', 'stroke-width':2}, g)}; }
    if (q.t === 'grip' || q.t === 'plat' || q.t === 'vdb') return {q, g:mk('line', {class:'eql', 'stroke-width':5, 'stroke-linecap':'round'}, eqG)};
  });

  const t0 = performance.now();
  const frame = now => {
    const t = ((now - t0) % D.period) / D.period;
    let k = 0.5 - 0.5*Math.cos(2*Math.PI*t);
    k = Math.min(1, Math.max(0, (k - 0.06) / 0.88));
    const P = {};
    for (const key in D.A) { const a = D.A[key], b = D.B[key]; P[key] = [a[0] + (b[0]-a[0])*k, a[1] + (b[1]-a[1])*k]; }
    segs.forEach(s => setLine(s.el, P[s.pr[0]], P[s.pr[1]]));
    if (foot) setLine(foot, P.an, [P.an[0] + 10*(D.face || 1), P.an[1]]);
    head.setAttribute('cx', P.head[0].toFixed(1)); head.setAttribute('cy', P.head[1].toFixed(1));
    eqs.forEach(({q, g, cable, line, c1, c2}) => {
      if (q.t === 'plate') g.setAttribute('transform', `translate(${P[q.p][0].toFixed(1)},${P[q.p][1].toFixed(1)})`);
      else if (q.t === 'db' || q.t === 'pad') { g.setAttribute('cx', P[q.p][0].toFixed(1)); g.setAttribute('cy', P[q.p][1].toFixed(1)); }
      else if (q.t === 'hbar') { const a = [P.ha2[0]-10, P.ha2[1]], b = [P.ha[0]+10, P.ha[1]]; setLine(g, a, b); setLine(cable, [100,0], [(a[0]+b[0])/2, (a[1]+b[1])/2]); }
      else if (q.t === 'cable') setLine(g, q.from, P[q.p]);
      else if (q.t === 'vgrip') { const a = P[q.p]; setLine(g, [a[0], a[1]-7], [a[0], a[1]+7]); setLine(cable, q.from || [100,0], a); }
      else if (q.t === 'bar') { const a = P[q.p], b = P[q.p2]; setLine(line, a, b); c1.setAttribute('cx', a[0].toFixed(1)); c1.setAttribute('cy', a[1].toFixed(1)); c2.setAttribute('cx', b[0].toFixed(1)); c2.setAttribute('cy', b[1].toFixed(1)); }
      else if (q.t === 'vdb') setLine(g, [P[q.p][0], P[q.p][1]-7], [P[q.p][0], P[q.p][1]+7]);
      else if (q.t === 'grip') setLine(g, [P[q.p][0]-6, P[q.p][1]+1], [P[q.p][0]+6, P[q.p][1]-1]);
      else if (q.t === 'plat') { const n = Math.hypot(q.dir[0], q.dir[1]), ux = q.dir[0]/n, uy = q.dir[1]/n, px = -uy, py = ux, c = [P[q.p][0] + ux*5, P[q.p][1] + uy*5]; setLine(g, [c[0]-px*16, c[1]-py*16], [c[0]+px*16, c[1]+py*16]); }
    });
    demoRAF = requestAnimationFrame(frame);
  };
  demoRAF = requestAnimationFrame(frame);
}
function closeDemo(){ if (demoRAF) cancelAnimationFrame(demoRAF); demoRAF = null; const sh = document.getElementById('sheet'); sh.classList.add('hidden'); sh.innerHTML = ''; }

/* ---------- Timer ---------- */
const tEl = document.getElementById('timer'), tLabel = document.getElementById('tLabel'), tTime = document.getElementById('tTime'), tBar = document.getElementById('tBar');
let TM = null, actx = null;
function unlockAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const b = actx.createBuffer(1,1,22050), src = actx.createBufferSource();
    src.buffer = b; src.connect(actx.destination); src.start(0);
  } catch(e){}
}
function beep(n){
  if (S.sound === false) return;
  try { navigator.vibrate && navigator.vibrate([220,90,220,90,220]); } catch(e){}
  try {
    unlockAudio();
    const t0 = actx.currentTime, notes = n || 3;
    for (let i = 0; i < notes; i++) {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i*0.22;
      o.type = 'triangle'; o.frequency.setValueAtTime(i === notes-1 ? 1175 : 880, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.2);
    }
  } catch(e){}
}
function startTimer(phases, doneMsg, onDone){
  stopTimer();
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
  TM = {phases, i:0, doneMsg, onDone, end:Date.now() + phases[0].secs*1000, total:phases[0].secs};
  tEl.classList.remove('hidden'); tick(); TM.iv = setInterval(tick, 250);
}
function tick(){
  if (!TM) return;
  let left = Math.ceil((TM.end - Date.now())/1000);
  if (left <= 0) {
    beep(); TM.i++;
    if (TM.i >= TM.phases.length) { finishTimer(); return; }
    const p = TM.phases[TM.i]; TM.end = Date.now() + p.secs*1000; TM.total = p.secs; left = p.secs;
  }
  const p = TM.phases[TM.i];
  tEl.classList.toggle('hard', !!p.hard);
  tLabel.textContent = p.label;
  tTime.textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  tBar.style.width = `${Math.min(100, (1 - left/TM.total)*100)}%`;
}
function finishTimer(){
  const msg = TM.doneMsg, cb = TM.onDone; clearInterval(TM.iv); TM = null;
  if (cb) cb();
  tEl.classList.remove('hard'); tLabel.textContent = msg; tTime.textContent = 'Go'; tBar.style.width = '100%';
  setTimeout(() => { if (!TM) tEl.classList.add('hidden'); }, 3500);
}
function stopTimer(){ if (TM) clearInterval(TM.iv); TM = null; tEl.classList.add('hidden'); tEl.classList.remove('hard'); }

/* ---------- Helpers ---------- */
let toastT;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
function restore(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !d.logs) throw 0;
    S = Object.assign({startDate:S.startDate, logs:{}, body:[], picks:{}, sound:true, mode:'full', theme:'health'}, d);
    save(); render(); toast('Backup restored');
  } catch(e) { toast('That backup could not be read'); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  unlockAudio();
  if (e.target.id === 'sheet') { closeDemo(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { ui.tab = tab.dataset.tab; if (ui.tab === 'today') ui.date = ui.date || todayStr(); render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'mode': {
      S.mode = el.dataset.m; save();
      const t = typeFor(todayStr());
      render(true); toast(PLANS[S.mode].name + ' · today is ' + (WORKOUTS[t] ? WORKOUTS[t].title : CARDIO[t].title));
      break;
    }
    case 'theme': S.theme = el.dataset.t; save(); applyTheme(); render(true); break;
    case 'report': openReport(addDays(mondayOf(new Date()), (+el.dataset.w) * 7)); break;
    case 'sound': S.sound = S.sound === false; save(); render(true); if (S.sound) beep(1); break;
    case 'testsound': unlockAudio(); beep(); break;
    case 'demo': openDemo(el.dataset.ex); break;
    case 'swap': closeDemo(); openPicker(el.dataset.slot); break;
    case 'pick': {
      S.picks = S.picks || {};
      S.picks[el.dataset.slot] = el.dataset.ex;
      save(); closeDemo(); ui.tab = ui.tab; render(true); toast(EX[el.dataset.ex].name);
      break;
    }
    case 'closedemo': closeDemo(); break;
    case 'prevday': ui.date = ymd(addDays(parse(ui.date),-1)); render(); break;
    case 'nextday': ui.date = ymd(addDays(parse(ui.date),1)); render(); break;
    case 'gotoday': ui.date = todayStr(); render(); break;
    case 'prevweek': ui.weekOffset--; render(); break;
    case 'nextweek': ui.weekOffset++; render(); break;
    case 'openday': ui.date = el.dataset.d; ui.tab = 'today'; render(); break;
    case 'check': {
      const L = getLog(ui.date,true), k = el.dataset.k;
      L.checks[k] = !L.checks[k];
      mark(k.startsWith('wu') ? 'wu' : k.startsWith('cd') ? 'cd' : 'wk');
      save(); render(true); break;
    }
    case 'tset': {
      const id = el.dataset.ex, sIdx = +el.dataset.s, ex = EX[id];
      const row = el.closest('.set'), ri = row.querySelector('[data-f="r"]');
      const secs = Math.max(5, parseInt(ri.value, 10) || parseInt(ri.placeholder, 10) || ex.min);
      unlockAudio();
      startTimer([{label:`${ex.name} — set ${sIdx+1}`, secs}], 'Hold finished. Well done.', () => {
        const L = getLog(ui.date, true), arr = L.sets[id] = L.sets[id] || [];
        arr[sIdx] = Object.assign({}, arr[sIdx], {w:0, r:secs, done:true});
        mark('wk'); save(); render(true);
        if (ex.rest) setTimeout(() => startTimer([{label:`Rest before set ${sIdx+2}`, secs:ex.rest}], 'Rest over. Next set.'), 3600);
      });
      break;
    }
    case 'set': {
      const id = el.dataset.ex, s = +el.dataset.s, ex = EX[id], L = getLog(ui.date,true);
      const arr = L.sets[id] = L.sets[id] || [];
      const row = el.closest('.set'), wi = row.querySelector('[data-f="w"]'), ri = row.querySelector('[data-f="r"]');
      const cur = arr[s] || {};
      cur.w = wi ? (parseFloat(wi.value) || 0) : 0;
      cur.r = ri.value !== '' ? (parseInt(ri.value,10) || 0) : (parseInt(ri.placeholder,10) || ex.min);
      cur.done = !cur.done; arr[s] = cur;
      mark('wk'); save(); render(true);
      if (cur.done) {
        if (ex.rest) startTimer([{label:`Rest after ${ex.name.toLowerCase()}`, secs:ex.rest}], 'Rest over. Next set.');
        else startTimer([{label:'Superset: straight to the next exercise', secs:10}], 'Go');
      }
      break;
    }
    case 'finish': {
      const L = getLog(ui.date,true);
      if (!L.done) { mark(L.t && L.t.cd ? 'cd' : 'wk'); L.total = sessionSpan(L); }
      L.done = !L.done; save(); render(true);
      if (L.done) { stopTimer(); toast('Workout saved'); }
      break;
    }
    case 'intervals': {
      const ph = [{label:'Get ready', secs:10}];
      for (let r = 1; r <= 8; r++) { ph.push({label:`Round ${r} of 8: hard`, secs:30, hard:true}); ph.push({label:`Round ${r} of 8: easy`, secs:90}); }
      startTimer(ph, 'Intervals done. Cool down.');
      break;
    }
    case 't30': if (TM) { TM.end += 30000; TM.total += 30; tick(); } break;
    case 'tskip': if (TM) { if (TM.phases.length > 1 && TM.i < TM.phases.length-1) { TM.end = Date.now(); tick(); } else stopTimer(); } else stopTimer(); break;
    case 'addbody': {
      const d = document.getElementById('bDate').value, w = parseFloat(document.getElementById('bW').value), wa = parseFloat(document.getElementById('bWaist').value);
      if (!d || (isNaN(w) && isNaN(wa))) { toast('Enter your weight or waist first'); break; }
      S.body = S.body.filter(b => b.d !== d);
      S.body.push({d, w:isNaN(w) ? null : w, waist:isNaN(wa) ? null : wa});
      save(); render(true); toast('Check-in saved'); break;
    }
    case 'delbody': S.body = S.body.filter(b => b.d !== el.dataset.d); save(); render(true); break;
    case 'export': {
      try {
        const blob = new Blob([JSON.stringify(S)], {type:'application/json'}), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `training-log-backup-${todayStr()}.json`;
        document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded');
      } catch(e) { toast('Download blocked here. Use Copy backup text.'); }
      break;
    }
    case 'copy': {
      const txt = JSON.stringify(S);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied'), () => {
        const box = document.getElementById('pasteBox'); box.value = txt; box.select(); toast('Select all and copy the text box');
      });
      break;
    }
    case 'importfile': document.getElementById('importFile').click(); break;
    case 'importpaste': restore(document.getElementById('pasteBox').value); break;
    case 'reset':
      if (confirm('Delete every workout and check-in on this device?')) { S = {startDate:ymd(mondayOf(new Date())), logs:{}, body:[], picks:{}, sound:true, mode:S.mode, theme:S.theme}; save(); render(); toast('All data deleted'); }
      break;
  }
});

view.addEventListener('input', e => {
  const el = e.target;
  if (!el.dataset.f) return;
  const id = el.dataset.ex, s = +el.dataset.s, L = getLog(ui.date,true);
  const arr = L.sets[id] = L.sets[id] || [];
  arr[s] = arr[s] || {done:false};
  if (el.dataset.f === 'w') {
    const v = parseFloat(el.value); arr[s].w = isNaN(v) ? null : v;
    for (let k = s+1; k < EX[id].sets; k++) {
      if (arr[k] && arr[k].done) continue;
      arr[k] = arr[k] || {done:false}; arr[k].w = arr[s].w;
      const inp = view.querySelector(`input[data-f="w"][data-ex="${id}"][data-s="${k}"]`); if (inp) inp.value = el.value;
    }
  } else {
    const v = parseInt(el.value,10); arr[s].r = isNaN(v) ? null : v;
  }
  save();
});

view.addEventListener('change', e => {
  if (e.target.id === 'startDate' && e.target.value) {
    S.startDate = ymd(mondayOf(parse(e.target.value))); save(); render(true); toast('Start week updated');
  }
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => restore(rd.result); rd.readAsText(f); e.target.value = '';
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDemo(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

setInterval(() => {
  const el = document.getElementById('liveClock');
  if (el && el.dataset.live === '1' && +el.dataset.start) el.textContent = fmtClock(Date.now() - +el.dataset.start);
}, 1000);

/* ---------- Start ---------- */
(async () => {
  const d = await store.load();
  if (d) S = Object.assign({startDate:null, logs:{}, body:[], picks:{}, sound:true, mode:'full', theme:'health'}, d);
  if (!S.startDate) { S.startDate = ymd(mondayOf(new Date())); save(); }
  applyTheme();
  render();
  const sp = document.getElementById('splash');
  if (sp) setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 600); }, 1000);
})();
